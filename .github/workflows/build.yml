name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        lsb_release -a && sudo apt-get update && sudo apt-get install --assume-yes gcc clang imagemagick libglfw3-dev libopenvr-dev libglm-dev libmpv-dev
    - name: make
      run: make compile-headless
